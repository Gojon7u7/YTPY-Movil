name: Compilar YTPY Android APK (con FFmpeg ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  compilar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Configurar Java 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Flutter SDK (Versión 3.24.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: 5. Aceptar licencias Android, instalar Flet y empaquetar APK base
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          pip install --upgrade pip
          pip install flet==0.25.2
          flet build apk --project "YTPY Studio" --description "Descargador Profesional MP4 MP3 FLAC" --no-rich-output

      - name: 6. Descargar e inyectar FFmpeg ARM64 (libffmpeg.so) para Android 10+
        run: |
          sudo apt-get update && sudo apt-get install -y wget xz-utils zip unzip
          
          # Descargar Apktool directamente desde GitHub Releases (URL estable y permanente)
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool

          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz
          tar -xf ffmpeg-release-arm64-static.tar.xz
          CARPETA_FFMPEG=$(find . -maxdepth 1 -type d -name "ffmpeg-*-arm64-static" | head -n 1)

          APK_ORIGINAL=$(find build/apk -name "*.apk" | head -n 1)
          apktool d -s "$APK_ORIGINAL" -o apk_modificado

          sed -i 's/android:extractNativeLibs="[^"]*"//g' apk_modificado/AndroidManifest.xml
          sed -i 's/android:requestLegacyExternalStorage="[^"]*"//g' apk_modificado/AndroidManifest.xml
          sed -i 's/<application/<application android:extractNativeLibs="true" android:requestLegacyExternalStorage="true"/g' apk_modificado/AndroidManifest.xml

          mkdir -p apk_modificado/lib/arm64-v8a
          cp "$CARPETA_FFMPEG/ffmpeg" apk_modificado/lib/arm64-v8a/libffmpeg.so
          chmod 755 apk_modificado/lib/arm64-v8a/libffmpeg.so

          apktool b --use-aapt2 apk_modificado -o ytpy_sin_firmar.apk

          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)

          "$ZIPALIGN" -p -f 4 ytpy_sin_firmar.apk ytpy_alineado.apk

          keytool -genkey -v -keystore llave_ytpy.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ytpy -storepass ytpy1234 -key-pass ytpy1234 -dname "CN=YTPY Studio, OU=Dev, O=YTPY, L=Latam, S=Latam, C=VE"
          "$APKSIGNER" sign --ks llave_ytpy.jks --ks-pass pass:ytpy1234 --key-pass pass:ytpy1234 --out YTPY_Studio_Android.apk ytpy_alineado.apk

      - name: 7. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: YTPY-Studio-Android-APK
          path: YTPY_Studio_Android.apk
